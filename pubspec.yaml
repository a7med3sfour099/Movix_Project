
name: movixapp
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  gap: ^3.0.1
  ionicons: ^0.2.3
  awesome_dialog: ^3.3.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.0
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  bloc: ^9.2.1
  responsive_sizer: ^3.3.1
  responsive_builder: ^0.7.1
  app_links: ^7.2.2
  flutter_facebook_auth: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/auth_assets/

  fonts:
    - family: "JakartaSans"
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
